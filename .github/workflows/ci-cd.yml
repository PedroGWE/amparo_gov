name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cidadao/api db:generate

      - name: Build shared package for typecheck
        run: pnpm --filter @cidadao/shared build

      - name: Lint and typecheck
        run: pnpm lint

      - name: Run tests
        run: pnpm --filter @cidadao/api exec jest --runInBand

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PORTAL_TRANSPARENCIA_TOKEN: ${{ secrets.PORTAL_TRANSPARENCIA_TOKEN }}
        run: |
          test -n "$SSH_USER"
          test -n "$PORTAL_TRANSPARENCIA_TOKEN"
          printf '%s\n' "$PORTAL_TRANSPARENCIA_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/cidadao-futuro && git fetch origin main && git pull --ff-only origin main && python3 infra/scripts/set-portal-transparency-token.py'
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/cidadao-futuro && git fetch origin main && git pull --ff-only origin main && exec bash infra/scripts/deploy.sh'
