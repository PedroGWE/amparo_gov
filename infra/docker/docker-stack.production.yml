version: '3.8'

services:
  app:
    image: nginx:alpine
    networks:
      - Vidrofy
    configs:
      - source: cidadao_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.cidadao.rule=Host(`app.amparogov.org`) || Host(`educa.amparogov.org`)
        - traefik.http.routers.cidadao.entrypoints=websecure
        - traefik.http.routers.cidadao.tls=true
        - traefik.http.routers.cidadao.tls.certresolver=letsencryptresolver
        - traefik.http.services.cidadao.loadbalancer.server.port=80
        - traefik.docker.network=Vidrofy

configs:
  cidadao_nginx_conf:
    name: cidadao_nginx_${CIDADAO_NGINX_CONFIG_HASH}
    file: ./nginx.production.conf

networks:
  Vidrofy:
    external: true
