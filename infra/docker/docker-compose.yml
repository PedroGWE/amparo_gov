services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cidadao_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cidadao_futuro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cidadao_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cidadao_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-semevo}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-semevo}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?configure REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?configure JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?configure JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DIR: /data/uploads
      NFSE_FOCUS_TENANTS_JSON: ${NFSE_FOCUS_TENANTS_JSON:-}
      NFSE_PRODUCTION_ENABLED: ${NFSE_PRODUCTION_ENABLED:-false}
      NFSE_CREDENTIALS_KEY: ${NFSE_CREDENTIALS_KEY:-}
      RESOURCES_SCHEDULER_ENABLED: ${RESOURCES_SCHEDULER_ENABLED:-true}
      RESOURCES_ADMIN_USER_IDS: ${RESOURCES_ADMIN_USER_IDS:-}
      RESOURCES_PROGRAM_YEAR: ${RESOURCES_PROGRAM_YEAR:-}
      PROSAS_CLIENT_ID: ${PROSAS_CLIENT_ID:-}
      PROSAS_CLIENT_SECRET: ${PROSAS_CLIENT_SECRET:-}
      PROSAS_SCOPES: ${PROSAS_SCOPES:-confidential:processos.read}
      PROSAS_ACCESS_CONFIRMED: ${PROSAS_ACCESS_CONFIRMED:-false}
    volumes:
      - uploads_data:/data/uploads
    networks: [backend, frontend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [frontend]
    depends_on:
      - api
    restart: unless-stopped

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  redis_data:
  uploads_data:
